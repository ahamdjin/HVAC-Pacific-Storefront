name: Storefront CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@10.26.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck storefront
        run: pnpm --filter @workspace/hvac-pacific run typecheck
      - name: Typecheck catalog scripts
        run: pnpm --filter @workspace/scripts run typecheck
      - name: Check XLSX reader
        run: pnpm --filter @workspace/scripts run check:xlsx-reader
      - name: Build storefront
        env:
          SHOPIFY_MOCK_BUILD: "true"
        run: pnpm --filter @workspace/hvac-pacific run build

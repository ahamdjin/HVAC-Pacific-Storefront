name: Storefront CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@10.26.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck storefront
        run: pnpm --filter @workspace/hvac-pacific run typecheck
      - name: Typecheck catalog scripts
        run: pnpm --filter @workspace/scripts run typecheck
      - name: Check XLSX reader
        run: pnpm --filter @workspace/scripts run check:xlsx-reader
      - name: Test purchase compliance policy
        run: pnpm --filter @workspace/scripts run test:purchase-policy
      - name: Build storefront
        env:
          SHOPIFY_MOCK_BUILD: "true"
        run: pnpm --filter @workspace/hvac-pacific run build
      - name: Smoke test production storefront
        env:
          SHOPIFY_MOCK_BUILD: "true"
          ZH_TRANSLATIONS_REVIEWED: "false"
          PORT: "3000"
          QA_BASE_URL: "http://127.0.0.1:3000"
        run: |
          pnpm --filter @workspace/hvac-pacific run start > /tmp/hvac-storefront.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3000/ >/dev/null; then
            cat /tmp/hvac-storefront.log
            exit 1
          fi
          pnpm --filter @workspace/scripts run test:storefront-smoke

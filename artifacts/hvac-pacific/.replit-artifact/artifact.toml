kind = "web"
previewPath = "/"
title = "HVAC Pacific"
description = "A Southern California HVAC equipment and parts storefront with English and Simplified Chinese support, backed by Shopify for product data and checkout."
version = "1.0.0"
id = "artifacts/hvac-pacific"
router = "path"

[[services]]
name = "web"
paths = ["/", "/_next/hmr", "/api/cart", "/api/revalidate"]
localPort = 20856

[services.development]
run = "pnpm --filter @workspace/hvac-pacific run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/hvac-pacific", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/hvac-pacific", "run", "start"]

[services.production.run.env]
PORT = "20856"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "20856"
BASE_PATH = "/"

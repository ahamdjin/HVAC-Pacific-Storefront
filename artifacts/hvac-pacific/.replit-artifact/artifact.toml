kind = "web"
previewPath = "/"
title = "HVAC Pacific"
description = "A Southern California HVAC equipment and parts storefront with English and Simplified Chinese support, backed by Shopify for product data and checkout."
version = "1.0.0"
id = "artifacts/hvac-pacific"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20856

[services.development]
run = "pnpm --filter @workspace/hvac-pacific run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hvac-pacific", "run", "build" ]
serve = "static"
publicDir = "artifacts/hvac-pacific/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20856"
BASE_PATH = "/"
